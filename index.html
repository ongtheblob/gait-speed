<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gait Speed Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      color: #2d3748;
      transition: border-color 0.2s;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #4299e1;
    }

    .speed-hint {
      font-size: 0.78rem;
      color: #a0aec0;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4299e1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background: #3182ce;
    }

    .reset-btn {
      background: #e2e8f0;
      color: #4a5568;
      margin-top: 10px;
    }

    .reset-btn:hover {
      background: #cbd5e0;
    }

    .results {
      margin-top: 28px;
      background: #ebf8ff;
      border-radius: 12px;
      padding: 20px;
      display: none;
    }

    .results h2 {
      font-size: 1rem;
      color: #2b6cb0;
      margin-bottom: 14px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #2d3748;
      padding: 6px 0;
      border-bottom: 1px solid #bee3f8;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-row.average {
      font-weight: 700;
      font-size: 1rem;
      color: #2b6cb0;
      padding-top: 12px;
    }

    .error {
      color: #e53e3e;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    .interpretation {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .interp-normal  { background: #c6f6d5; color: #276749; }
    .interp-caution { background: #fefcbf; color: #744210; }
    .interp-risk    { background: #fed7d7; color: #9b2c2c; }
  </style>
</head>
